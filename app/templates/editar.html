{% extends 'base.html' %}

{% block conteudo %}

<h2>Editar Usuário</h2>

<form action="/atualizar/{{ usuario[0] }}" method="POST" onsubmit="return validarSenhas()">

    <label>Nome:</label>
    <input type="text" name="nome" value="{{ usuario[1] }}" required>

    <br><br>

    <label>E-mail:</label>
    <input type="email" name="email" value="{{ usuario[2] }}" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" id="senha" name="senha" value="{{ usuario[3] }}" required>

    <br><br>

    <label>Confirmar senha:</label>
    <input type="password" id="confirmar_senha" name="confirmar_senha" value="{{ usuario[3] }}" required>

    <br><br>

    <button type="submit">Salvar alterações</button>

</form>

<script>

function validarSenhas() {

    let senha = document.getElementById("senha").value;
    let confirmar_senha = document.getElementById("confirmar_senha").value;

    if (senha != confirmar_senha) {

        alert("As senhas não são iguais!");

        return false;
    }

    return true;
}

</script>

{% endblock %}
