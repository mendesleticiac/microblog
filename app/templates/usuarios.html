{% extends 'base.html' %}

{% block conteudo %}

<div class="usuarios">

    <h2>Usuários cadastrados</h2>

    <table class="tabela-usuarios">

        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Senha</th>
            <th>Ações</th>
        </tr>

        {% for usuario in usuarios %}

        <tr>

            <td>{{ usuario[0] }}</td>

            <td>{{ usuario[1] }}</td>

            <td>{{ usuario[2] }}</td>

            <td>{{ usuario[3] }}</td>

            <td>

                <a
                    href="/editar/{{ usuario[0] }}"
                    class="botao-editar"
                >
                    Editar
                </a>

                <form
                    action="/excluir/{{ usuario[0] }}"
                    method="POST"
                    style="display:inline;"
                >
                    <button
                        type="submit"
                        class="botao-excluir"
                    >
                        Excluir
                    </button>
                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
